<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071047">
    <meta name="description" content="개발자의 기록이 더 멀리 닿도록 돕는 블로그 플랫폼">
    <title>Rilog. — 개발자를 위한 블로그 플랫폼</title>
    <link rel="icon" href="/icon.png" type="image/png">
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
<header class="app-header">
    <div class="header-inner">
        <a class="brand" href="#/" aria-label="Rilog 홈">Rilog<span>.</span></a>
        <nav class="primary-nav" aria-label="주요 메뉴">
            <a class="nav-link auth-only" id="my-blog-link" href="#/" hidden>내 블로그</a>
            <a class="nav-link auth-only" href="#/me" data-nav="me" hidden>내 글</a>
            <a class="nav-link auth-only" href="#/dashboard" data-nav="dashboard" hidden>통계</a>
        </nav>
        <div class="header-actions">
            <button class="icon-button" id="theme-toggle" type="button" aria-label="다크 모드로 전환">
                <span aria-hidden="true" id="theme-icon">◐</span>
            </button>
            <a class="button button-primary auth-only" href="#/write" hidden>글쓰기</a>
            <a class="button button-secondary guest-only" href="/oauth2/authorization/google">Google 로그인</a>
            <button class="profile-button auth-only" id="profile-button" type="button" hidden aria-label="사용자 메뉴">
                <span class="profile-avatar" id="profile-avatar" aria-hidden="true"></span>
                <span class="profile-name" id="profile-name"></span>
            </button>
        </div>
    </div>
</header>

<main id="main-content" tabindex="-1">
    <div class="app-shell" id="app" aria-live="polite"></div>
</main>

<footer class="app-footer">
    <div class="footer-inner">
        <strong>Rilog.</strong>
        <span>개발자의 기록이 더 멀리 닿도록</span>
    </div>
</footer>

<div class="profile-menu" id="profile-menu" hidden>
    <a class="auth-only" id="profile-blog-link" href="#/" hidden>내 블로그</a>
    <a class="auth-only" href="#/me" hidden>내 글 관리</a>
    <a class="auth-only" href="#/dashboard" hidden>통계</a>
    <a class="auth-only" href="#/settings/profile" hidden>프로필 설정</a>
    <button type="button" id="logout-button">로그아웃</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
